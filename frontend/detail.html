<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horse Details</title>
  <link rel="stylesheet" href="detail-styles.css">
</head>
<body>
  <header>
    <a href="index.html">← Regresar</a>
  </header>

  <div class="detail-container">
    <!-- Left sidebar - fixed -->
    <aside class="horse-sidebar">
      <div id="horseSidebar"></div>
    </aside>

    <!-- Main content - scrollable -->
    <main class="horse-main">
        

        <!-- Tab Navigation -->
        <div class="detail-tabs">
          <button class="tab-btn active" data-tab="info">Información</button>
          <button class="tab-btn" data-tab="history">Historial</button>
        </div>

        <!-- Tab Content -->
        <div class="tab-content">
          <!-- Información Tab -->
          <div id="info-tab" class="tab active">
            <!-- Record buttons -->
            <div class="record-buttons">
            <button class="record-btn" data-record="passport">Registro Pasaporte</button>
            <button class="record-btn" data-record="vaccines">Registro Vacunas</button>
            <button class="record-btn" data-record="medical">Registro Examen de Laboratorio</button>
            <button class="record-btn" data-record="hauling">Registro Traslado</button>
            </div>
            <div id="horseDetail"></div>
          </div>

            <!-- Historial Tab -->
          <div id="history-tab" class="tab">
            <div id="horseTimeline"></div>
          </div>
        </div>
      
      
    </main>
  </div>

    <!-- Passport Modal -->
  <div id="passportModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Registro Pasaporte</h2>
      
      <form id="passportForm">
        <div class="horse-input">
          <label for="expeditionDate">Fecha de Expedición</label>
          <input type="date" id="expeditionDate" name="expedition_date" required>
        </div>
        <button type="submit">Guardar</button>
      </form>
    </div>
  </div>

    <!-- Vaccine Modal -->
  <div id="vaccineModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Registro Vacunas</h2>
      
      <form id="vaccineForm">
        <div class="horse-input">
          <label for="vaccineDate">Fecha de Vacunación *</label>
          <input type="date" id="vaccineDate" name="vaccine_date" required>
        </div>

        <div class="horse-input">
          <label for="vaccineName">Nombre de Vacuna *</label>
          <input type="text" id="vaccineName" name="vaccine_name" required>
        </div>

        <div class="horse-input">
          <label for="vaccineExpiration">Fecha de Expiración *</label>
          <input type="date" id="vaccineExpiration" name="vaccine_expiration" required>
        </div>

        <div class="horse-input">
          <label for="batchNumber">Número de Lote *</label>
          <input type="text" id="batchNumber" name="batch_number" required>
        </div>

        <div class="horse-input">
          <label for="route">Ruta/Vía *</label>
          <input type="text" id="route" name="route" required>
        </div>

        <div class="horse-input">
          <label for="veterinarian">Veterinario *</label>
          <select id="veterinarian" name="veterinarian_id" required>
            <option value="">Seleccionar veterinario</option>
          </select>
        </div>

        <button type="submit">Guardar</button>
      </form>
    </div>
  </div>

  <!-- Lab Test Modal -->
  <div id="labTestModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Registro Examen Laboratorio</h2>
      
      <form id="labTestForm">
        <div class="horse-input">
          <label for="testDate">Fecha de Prueba *</label>
          <input type="date" id="testDate" name="test_date" required>
        </div>

        <div class="horse-input">
          <label for="testedFor">Probado Para *</label>
          <input type="text" id="testedFor" name="tested_for" placeholder="Ej: Anemia, Infección" required>
        </div>

        <div class="horse-input">
          <label for="testType">Tipo de Prueba *</label>
          <input type="text" id="testType" name="test_type" placeholder="Ej: Análisis de sangre" required>
        </div>

        <div class="horse-input">
          <label for="testResult">Resultado *</label>
          <textarea id="testResult" name="test_result" rows="3" required></textarea>
        </div>

        <div class="horse-input">
          <label for="laboratory">Laboratorio Oficial *</label>
          <input type="text" id="laboratory" name="official_laboratory" required>
        </div>

        <div class="horse-input">
          <label for="labVeterinarian">Veterinario *</label>
          <select id="labVeterinarian" name="veterinarian_id" required>
            <option value="">Seleccionar veterinario</option>
          </select>
        </div>

        <button type="submit">Guardar</button>
      </form>
    </div>
  </div>
  <!-- Hauling Modal -->
  <div id="haulingModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Registro Transporte</h2>
      
      <form id="haulingForm">
        <div class="horse-input">
          <label for="haulingDate">Fecha *</label>
          <input type="date" id="haulingDate" name="date" required>
        </div>

        <div class="horse-input">
          <label for="haulingCity">Ciudad *</label>
          <input type="text" id="haulingCity" name="city" required>
        </div>

        <div class="horse-input">
          <label for="haulingCountry">País *</label>
          <input type="text" id="haulingCountry" name="country" required>
        </div>

        <div class="horse-input">
          <label for="haulingPurpose">Propósito *</label>
          <input type="text" id="haulingPurpose" name="purpose" placeholder="Ej: Competencia, Venta" required>
        </div>

        <div class="horse-input">
          <label for="haulingDestination">Destino *</label>
          <input type="text" id="haulingDestination" name="destination" required>
        </div>

        <div class="horse-input">
          <label for="haulingDuration">Duración (días) *</label>
          <input type="number" id="haulingDuration" name="duration" min="1" required>
        </div>

        <div class="horse-input">
          <label for="haulingVeterinarian">Veterinario *</label>
          <select id="haulingVeterinarian" name="veterinarian_id" required>
            <option value="">Seleccionar veterinario</option>
          </select>
        </div>

        <button type="submit">Guardar</button>
      </form>
    </div>
  </div>
    <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="detail-script.js" defer></script>
</body>
</html>
