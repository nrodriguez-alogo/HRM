<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horse Details</title>
  <link rel="stylesheet" href="detail-styles.css">
</head>
<body>
  <header>
    <a href="index.html">← Regresar</a>
  </header>

  <div class="detail-container">
    <!-- Left sidebar - fixed -->
    <aside class="horse-sidebar">
      <div id="horseSidebar"></div>
    </aside>

    <!-- Main content - scrollable -->
    <main class="horse-main">
        <!-- Record buttons -->
        <div class="record-buttons">
        <button class="record-btn" data-record="passport">Registro Pasaporte</button>
        <button class="record-btn" data-record="vaccines">Registro Vacunas</button>
        <button class="record-btn" data-record="medical">Registro Examen Médico</button>
        <button class="record-btn" data-record="clinical">Registro Historia Clínica</button>
        </div>
      <div id="horseDetail"></div>
      
    </main>
  </div>

    <!-- Passport Modal -->
  <div id="passportModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Registro Pasaporte</h2>
      
      <form id="passportForm">
        <div class="horse-input">
          <label for="expeditionDate">Fecha de Expedición</label>
          <input type="date" id="expeditionDate" name="expedition_date" required>
        </div>
        <button type="submit">Guardar</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="detail-script.js" defer></script>
</body>
</html>
