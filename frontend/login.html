<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Halter</title>
    <link rel="stylesheet" href="login-styles.css">
</head>
<body>
  <div class="login-container">
    <!-- Login Form -->
    <div id="loginForm">
      <h1>HRM Login</h1>
      
      <form id="loginFormElement">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      
      <p id="loginError" class="error"></p>
      
      <p class="toggle-form">
        Don't have an account? <a onclick="toggleForms()">Sign up</a>
      </p>
    </div>

    <!-- Signup Form (hidden by default) -->
    <div id="signupForm" style="display: none;">
      <h1>Create Account</h1>
      
      <form id="signupFormElement">
        <input type="email" id="signupEmail" placeholder="Email" required>
        <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required>
        <input type="text" id="signupName" placeholder="Full Name" required>
        <button type="submit">Sign Up</button>
      </form>
      
      <p id="signupError" class="error"></p>
      
      <p class="toggle-form">
        Already have an account? <a onclick="toggleForms()">Log in</a>
      </p>
    </div>
  </div>
</body>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Login page script -->
  <script src="login-script.js"></script>
</html>
